name: echo-learning

services:
  db:
    image: ${IMAGE_REGISTRY:-docker.io/library}/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先复制 .env.example 为 .env 并设置数据库密码}
      MYSQL_DATABASE: ${DB_NAME:-echo_learning}
      MYSQL_USER: ${DB_USER:-echo}
      MYSQL_PASSWORD: ${DB_PASS:?请在 .env 中设置 DB_PASS}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  backend:
    build:
      context: .
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io/library}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-echo_learning}
      DB_USER: ${DB_USER:-echo}
      DB_PASS: ${DB_PASS:?请在 .env 中设置 DB_PASS}
      PORT: "8080"
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy
        restart: true

  frontend:
    build:
      context: ${FRONTEND_PATH:-../web-Echo-learning}
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io/library}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true

volumes:
  mysql_data:
